name: King365
options:
  bundleIdPrefix: com.king365
  deploymentTarget:
    iOS: "17.0"
packages:
  VLCKit:
    url: https://github.com/koombea/vlckit-spm
    from: 3.6.0
targets:
  King365:
    type: application
    platform: iOS
    sources:
      - path: King365
        excludes:
          - "*.md"
    scheme: {}
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Falken IPTV
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: Falken IPTV utilise le micro pour chercher un film ou une série à la voix.
        NSSpeechRecognitionUsageDescription: La reconnaissance vocale permet de trouver un film ou une série en disant son titre.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.king365.app.transfert
            CFBundleURLSchemes:
              - falken
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.king365.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
